name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  go-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.24.13'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Make verify-boundary-contract
        run: make verify-boundary-contract

      - name: Managed verify-ci-mvp-file with mock providers
        env:
          WORKORCH_MANAGED_VERIFY_TARGET: verify-ci-mvp-file
          WORKORCH_MANAGED_VERIFY_ARTIFACT_DIR: .ci-artifacts/managed-workorch
          WORKORCH_MANAGED_VERIFY_KEEP_ARTIFACTS: '1'
          WORKORCH_VERIFY_KEEP_TMP: '1'
        run: |
          # CI intentionally runs only deployed-instance checks that use local
          # mock providers. Real LLM / real weather checks require external
          # credentials and are kept out of CI to avoid false negatives.
          ./scripts/verify-workorch-managed-full.sh

      - name: Upload managed verification artifacts
        if: failure()
        # Diagnostics are useful but must not turn a completed verification
        # into a CI failure when the repository artifact quota is exhausted.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: workorch-managed-verify-artifacts-go${{ matrix.go-version }}
          path: .ci-artifacts/managed-workorch
          if-no-files-found: ignore
          retention-days: 3
