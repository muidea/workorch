name: ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

jobs:
  go-ci:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go-version:
          - '1.22'
          - '1.23'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      - name: Make fmt-check
        run: make fmt-check

      - name: Make vet
        run: make vet

      - name: Make test
        run: make test

      - name: Make build
        run: make build

      - name: Make run-file
        run: make run-file

      - name: Upload built binary
        if: matrix.go-version == '1.23'
        uses: actions/upload-artifact@v4
        with:
          name: workorchd-linux-amd64-go${{ matrix.go-version }}
          path: bin/workorchd
          if-no-files-found: error
