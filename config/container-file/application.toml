endpointName = "workorch"

[server]
addr = ":8080"
readHeaderTimeout = "5s"
readTimeout = "15s"
writeTimeout = "180s"
idleTimeout = "60s"
shutdownTimeout = "5s"
maxConcurrentRuns = 1

[repository]
backend = "file"
dataDir = "/var/lib/workorch"

[runtime]
defaultSoulId = ""
maxRuntimeRepairAttempts = 10
maxProviderRetryAttempts = 10
shellCommandTimeout = "60s"

[llm]
defaultProvider = "local"

[llm.providers.local]
provider = ""
baseURL = ""
apiKey = ""
model = ""
timeout = "60s"
disabled = false

[governance.autoTicket]
enabled = true
minConfidence = 0.82
maxPerRun = 5

[governance.autoApproval]
enabled = true
minConfidence = 0.9
maxPerRun = 3
allowReadOnly = true
allowWorkspaceWrite = true
requireHumanFor = ["secret_access", "external_write", "destructive_operation", "production_operation"]

[governance.budget]
maxConsecutiveFailures = 2
maxRepeatedSamePrompt = 1
