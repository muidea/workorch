endpointName = "workorchd"

[server]
addr = ":8080"
readHeaderTimeout = "5s"
readTimeout = "15s"
writeTimeout = "30s"
idleTimeout = "60s"
shutdownTimeout = "5s"
maxConcurrentRuns = 1

[repository]
backend = "memory"
dataDir = "/var/lib/workorch"

[llm]
defaultProvider = "local"

[llm.providers.local]
provider = ""
baseURL = ""
apiKey = ""
model = ""
timeout = "60s"
disabled = false
