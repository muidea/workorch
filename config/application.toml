endpointName = "workorchd"

[server]
addr = ":8080"
readHeaderTimeout = "5s"
readTimeout = "15s"
writeTimeout = "180s"
idleTimeout = "60s"
shutdownTimeout = "5s"
maxConcurrentRuns = 100

[repository]
backend = "file"
dataDir = ".workorch-data"

[runtime]
defaultSoulId = ""

[llm]
defaultProvider = "local"
defaultEmbeddingProvider = ""

[llm.providers.local]
provider = "compatible"
baseURL = ""
apiKey = ""
model = ""
timeout = "60s"
disabled = true
chatCompletions = true
streaming = false
nonChatOperations = []
