endpointName = 'workorch'

[server]
addr = '127.0.0.1:8080'
readHeaderTimeout = '5s'
readTimeout = '15s'
writeTimeout = '180s'
idleTimeout = '60s'
shutdownTimeout = '5s'
defaultDialogLanguage = ''

[repository]
backend = 'file'
dataDir = '.workorch-data'

[runtime]
defaultSoulId = ''
maxRuntimeRepairAttempts = 10
maxProviderRetryAttempts = 10
maxContractViolationRetriesPerStep = 2
maxContractViolationRetriesPerRun = 8
maxRepeatedContractViolationSignature = 1
maxConsecutiveContractViolationNoShapeChange = 1
shellCommandTimeout = '60s'

[runtime.git]
defaultTimeout = '30s'

[runtime.llmOutput]
maxDocumentRecoveryAttempts = 3

[llm.aiProxy]
baseURL = 'http://127.0.0.1:8080'
apiKey = ''
timeout = '180s'
catalogRequestTimeout = '5s'
catalogTTL = '5m'
catalogMaxStaleAge = '24h'
maxCatalogResponseBytes = 1048576
maxCatalogModels = 1000

[llm.defaultChat]
providerID = 'ai-proxy'
modelID = 'gpt-5.5'

[llm.budget]
contextUtilizationRatio = 0.75
estimatedTokensPerByte = 0.25

[webSearch]
defaultProvider = ''

[webSearch.providers]

[governance]
[governance.autoTicket]
enabled = true
minConfidence = 0.82
maxPerRun = 5

[governance.autoApproval]
enabled = true
minConfidence = 0.9
maxPerRun = 3
allowReadOnly = true
allowWorkspaceWrite = true
requireHumanFor = ['secret_access', 'external_write', 'destructive_operation', 'production_operation']

[governance.budget]
maxConsecutiveFailures = 2
maxRepeatedSamePrompt = 1

[ssh]
defaultTimeout = '30s'
secretsDirectory = 'ssh'

[ssh.targets]
[ssh.sessions]
[ssh.credentials]
