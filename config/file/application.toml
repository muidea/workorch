endpointName = 'workorch'

[server]
addr = ':8080'
readHeaderTimeout = '5s'
readTimeout = '15s'
writeTimeout = '180s'
idleTimeout = '60s'
shutdownTimeout = '5s'
maxConcurrentRuns = 1
staleDispatchedStepMinAge = ''
defaultDialogLanguage = ''

[repository]
backend = 'file'
dataDir = '.workorch-data'

[runtime]
defaultSoulId = ''
maxRuntimeRepairAttempts = 10
maxProviderRetryAttempts = 10
maxContractViolationRetriesPerStep = 2
maxContractViolationRetriesPerRun = 8
maxRepeatedContractViolationSignature = 1
maxConsecutiveContractViolationNoShapeChange = 1
shellCommandTimeout = '60s'

[runtime.git]
defaultTimeout = '30s'

[runtime.llmOutput]
maxPatchContentBytes = 12288
maxGraphBytes = 32768
maxGraphFileWrites = 3
schemaInvalidLargePreviewThreshold = 8192
maxArtifactChunkBytes = 8192
previousChunkTailBytes = 300
maxChunkRetryAttempts = 3
maxArtifactPlanAttempts = 2
maxArtifactReplanAttempts = 2

[llm.aiProxy]
baseURL = 'http://127.0.0.1:8080'
apiKey = ''
timeout = '180s'
catalogRequestTimeout = '5s'
catalogTTL = '5m'
catalogMaxStaleAge = '24h'
maxCatalogResponseBytes = 1048576
maxCatalogModels = 1000

[llm.defaultChat]
providerID = 'ai-proxy'
modelID = 'gpt-4o'

[llm.budget]
contextUtilizationRatio = 0.75
estimatedTokensPerByte = 0.25
# 0 uses the exact maxOutputTokens advertised by the selected /v1/models entry.
# Set a positive value only to apply a local output safety cap.
defaultMaxOutputTokens = 0
maxRequestBytes = 4194304

[webSearch]
defaultProvider = ''

[webSearch.providers]

[governance]
[governance.autoTicket]
enabled = true
minConfidence = 0.82
maxPerRun = 5

[governance.autoApproval]
enabled = true
minConfidence = 0.9
maxPerRun = 3
allowReadOnly = true
allowWorkspaceWrite = true
requireHumanFor = ['secret_access', 'external_write', 'destructive_operation', 'production_operation']

[governance.budget]
maxConsecutiveFailures = 2
maxRepeatedSamePrompt = 1
