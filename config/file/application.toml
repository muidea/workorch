endpointName = 'workorch'

[server]
addr = ':8080'
readHeaderTimeout = '5s'
readTimeout = '15s'
writeTimeout = '180s'
idleTimeout = '60s'
shutdownTimeout = '5s'
maxConcurrentRuns = 1
defaultDialogLanguage = ''

[repository]
backend = 'file'
dataDir = '.workorch-data'

[runtime]
defaultSoulId = ''
maxRuntimeRepairAttempts = 10
maxProviderRetryAttempts = 10
shellCommandTimeout = '60s'

[runtime.git]
enabled = true
writeEnabled = true
defaultTimeout = '30s'

[runtime.llmOutput]
maxPatchContentBytes = 12288
maxGraphBytes = 32768
maxGraphFileWrites = 3
schemaInvalidLargePreviewThreshold = 8192
maxArtifactChunkBytes = 8192
previousChunkTailBytes = 300
maxChunkRetryAttempts = 3
maxArtifactPlanAttempts = 2
maxArtifactReplanAttempts = 2

[llm]
defaultProvider = 'local'
defaultEmbeddingProvider = ''

[llm.modelCapabilities]
[llm.modelCapabilities.claude-4-5-200k]
provider = ''
modelPattern = '*claude*4?5*'
contextWindowTokens = 200000

[llm.modelCapabilities.claude-4-6-1m]
provider = ''
modelPattern = '*claude*4?6*'
contextWindowTokens = 1000000

[llm.modelCapabilities.claude-4-7-1m]
provider = ''
modelPattern = '*claude*4?7*'
contextWindowTokens = 1000000

[llm.modelCapabilities.deepseek-v4-1m]
provider = ''
modelPattern = '*deepseek*v4*'
contextWindowTokens = 1000000

[llm.modelCapabilities.gpt-codex-1m]
provider = 'compatible'
modelPattern = '*codex*'
contextWindowTokens = 1000000

[llm.modelCapabilities.gpt-instant-128k]
provider = ''
modelPattern = '*gpt-5.5*instant*'
contextWindowTokens = 131072

[llm.modelCapabilities.gpt-thinking-256k]
provider = ''
modelPattern = '*gpt-5.5*thinking*'
contextWindowTokens = 262144

[llm.modelCapabilities.minimax-m2-7-highspeed-205k]
provider = 'openai'
modelPattern = '*MiniMax-M2.7-highspeed*'
contextWindowTokens = 204800

[llm.providers]
[llm.providers.local]
provider = ''
baseURL = ''
apiKey = ''
model = ''
timeout = '1m0s'
disabled = false
chatCompletions = true
streaming = false
temperature = 0.0
failoverEnabled = false
contextWindowTokens = 32768

[webSearch]
defaultProvider = ''

[webSearch.providers]

[governance]
[governance.autoTicket]
enabled = true
minConfidence = 0.82
maxPerRun = 5

[governance.autoApproval]
enabled = true
minConfidence = 0.9
maxPerRun = 3
allowReadOnly = true
allowWorkspaceWrite = true
requireHumanFor = ['secret_access', 'external_write', 'destructive_operation', 'production_operation']

[governance.budget]
maxConsecutiveFailures = 2
maxRepeatedSamePrompt = 1
